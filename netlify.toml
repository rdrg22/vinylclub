[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Misma versión que en desarrollo (Vite 8 y TypeScript 7 necesitan Node moderno).
  NODE_VERSION = "24"

# SPA: todo se sirve desde index.html; las rutas antiguas (/buscar, /coleccion…) redirigen a la tienda.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
